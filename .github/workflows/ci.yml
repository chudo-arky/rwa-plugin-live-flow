name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install package and tooling
        run: python -m pip install --upgrade pip && python -m pip install -e . build twine pytest pytest-asyncio ruff bandit fastapi httpx
      - name: Lint
        run: ruff check .
      - name: Security scan
        run: bandit -q -c pyproject.toml -r rwa_live_flow
      - name: Tests
        run: pytest -q
      - name: UI layout tests (node)
        run: node --test tests/js/*.test.mjs
      - name: Build wheel from clean tree
        run: python -m build
      - name: Check metadata
        run: twine check dist/*
      - uses: actions/upload-artifact@v4
        if: matrix.python == '3.11'
        with:
          name: wheel
          path: dist/*.whl
